<div class="login-page">
  <div class="login-card">
    <div class="logo">🏛️</div>

    <h1>Museum CMS</h1>

    <p class="subtitle">Sign in to your account</p>
    @if (successMessage) {
      <div class="success close-box">
        <span>{{ successMessage }}</span>

        <!-- <button type="button" class="close-button" (click)="closeMessage()">×</button> -->
      </div>
    }
    <form (ngSubmit)="login()">
      <div class="form-group">
        <label>Email</label>

        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter your email"
          required
        />
      </div>

      <div class="form-group">
        <label>Password</label>

        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Enter your password"
          required
        />
      </div>

      @if (errorMessage) {
        <div class="error">
          {{ errorMessage }}
        </div>
      }

      <button type="submit" [disabled]="loading">
        @if (loading) {
          Processing...
        }

        @if (!loading) {
          Login
        }
      </button>
    </form>
    <div class="register-link">
      Don't have an account?

      <a routerLink="/register"> Register </a>
    </div>
  </div>
</div>
